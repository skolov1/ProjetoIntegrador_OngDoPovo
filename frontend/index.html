<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon-ong.png" />

        <!-- Montserrat: fonte definida no manual de identidade visual.
         preconnect evita o handshake TLS antes do CSS do Google Fonts. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
            rel="stylesheet"
        />
        <script
            src="https://cdn.userway.org/widget.js"
            data-account="7Fm7ude4yj"
            defer
        ></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Sistema ONG do Povo — gestão, divulgação e engajamento dos programas esportivos, de saúde, educacionais e comunitários."
        />
        <title>ONG do Povo</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            window._userway_config = window._userway_config || {};
            // 5 = canto inferior esquerdo (1 topo dir., 2 meio dir., 3 inf. dir.,
            // 4 inf. centro, 5 inf. esq., 6 meio esq., 7 topo esq., 8 topo centro).
            window._userway_config.position = "5";
        </script>

        <!-- VLibras (tradutor para Libras do governo federal). O plugin cria o
             próprio botão; "L" o coloca na esquerda, no meio da altura da tela,
             longe do botão do UserWay (canto inferior esquerdo). -->
        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
        <script>
            new window.VLibras.Widget({
                rootPath: "https://vlibras.gov.br/app",
                position: "L",
            });
        </script>
    </body>
</html>
