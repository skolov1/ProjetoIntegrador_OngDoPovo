openapi: 3.0.3
info:
  title: Sistema ONG do Povo — API
  version: 1.0.0
  description: API do Sistema ONG do Povo (Projeto Integrador). O schema em /api/schema/
    alimenta o gerador de client do frontend.
paths:
  /alunos/:
    get:
      operationId: alunos_list
      description: CRUD de alunos (admin).
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sexo
        schema:
          type: string
          enum:
          - F
          - M
          - N
          - O
        description: |-
          * `M` - Masculino
          * `F` - Feminino
          * `O` - Outro
          * `N` - Prefiro não informar
      - in: query
        name: turmas
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlunoListList'
          description: ''
    post:
      operationId: alunos_create
      description: CRUD de alunos (admin).
      tags:
      - alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
  /alunos/{id}/:
    get:
      operationId: alunos_retrieve
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    put:
      operationId: alunos_update
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    patch:
      operationId: alunos_partial_update
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlunoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlunoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlunoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    delete:
      operationId: alunos_destroy
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /auth/logout/:
    post:
      operationId: auth_logout_create
      description: Apaga o cookie httpOnly do refresh token. O access token em memoria
        continua valido ate expirar, entao o frontend deve limpar o estado da sessao
        imediatamente apos chamar esta rota.
      summary: Encerra a sessao
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Sessao encerrada
  /auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        GET /api/v1/auth/me/

        Dados do usuario autenticado (via header Authorization).
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /auth/token/:
    post:
      operationId: auth_token_create
      description: Recebe usuario e senha, devolve `{access, user}` no corpo e grava
        o refresh token num cookie httpOnly. O campo `refresh` nunca aparece na resposta.
        Limitado a 10 tentativas por minuto por IP.
      summary: Autentica e devolve o access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Credenciais invalidas
        '429':
          description: Limite de tentativas excedido
  /auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Le o refresh token do cookie httpOnly e devolve um novo access
        token. Com ROTATE_REFRESH_TOKENS ligado, o cookie e renovado junto.
      summary: Renova o access token
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Sessao expirada ou sem cookie valido
  /doacoes/itens/:
    get:
      operationId: doacoes_itens_list
      description: Registro de doações de itens (alimentos, cadeiras, muletas), só
