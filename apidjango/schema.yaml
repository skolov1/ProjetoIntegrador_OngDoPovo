  /doacoes/publico/:
    get:
      operationId: doacoes_publico_list
      description: |-
        GET /api/v1/doacoes/publico/

        Mural de doações. Só CONFIRMADAS e sem nenhum dado pessoal.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
