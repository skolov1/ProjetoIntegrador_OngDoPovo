          - CADEIRA_BANHO
          - CADEIRA_RODAS
          - MULETAS
          - OUTRO
        description: |-
          * `ALIMENTOS` - Alimentos não perecíveis
          * `CADEIRA_RODAS` - Cadeira de rodas
          * `MULETAS` - Muletas
          * `CADEIRA_BANHO` - Cadeira de banho
          * `OUTRO` - Outro
      - name: ordering
