components:
  schemas:
    AccessToken:
      type: object
      description: Corpo de /auth/token/refresh/ — so o access token volta.
      properties:
        access:
          type: string
      required:
      - access
    Aluno:
      type: object
      description: |-
        Serializer completo do aluno (admin).

        Regras de LGPD: menor de 18 anos não tem CPF próprio (o CPF fica no
        responsável) e só salva com a autorização do responsável, que vira um
        registro de `Consentimento`.
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          title: Nome completo
          maxLength: 150
        data_nascimento:
          type: string
          format: date
          title: Data de nascimento
        sexo:
          $ref: '#/components/schemas/SexoEnum'
        rg:
          type: string
          title: RG ou certidão de nascimento
          maxLength: 20
        cpf:
          type: string
          nullable: true
          maxLength: 14
        comprovante_residencia:
          allOf:
          - $ref: '#/components/schemas/ComprovanteResidenciaEnum'
          title: Comprovante de residência
        titulo_eleitor:
          allOf:
          - $ref: '#/components/schemas/TituloEleitorEnum'
          title: Título de eleitor
        nome_responsavel:
          type: string
          title: Nome do responsável
          maxLength: 150
        cpf_responsavel:
          type: string
          title: CPF do responsável
          maxLength: 14
        rg_responsavel:
          type: string
          title: RG do responsável
          maxLength: 20
        telefone_responsavel:
          type: string
          title: Telefone do responsável
          maxLength: 20
        endereco_responsavel:
          type: string
          title: Endereço do responsável
          maxLength: 255
        exame_aptidao:
          allOf:
          - $ref: '#/components/schemas/ExameAptidaoEnum'
          title: Exame de aptidão física
        exame_validade:
          type: string
          format: date
          nullable: true
          title: Validade do exame
        exame_situacao:
          type: string
          readOnly: true
          nullable: true
        consentimento_registrado:
          type: boolean
          readOnly: true
        turmas:
          type: array
          items:
            type: integer
        turmas_nomes:
          type: array
          items:
            type: string
          readOnly: true
        mensalidade_personalizada:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        mensalidade_calculada:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        mensalidade:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        ativo:
          type: boolean
        idade:
          type: integer
          readOnly: true
        eh_maior_de_idade:
          type: boolean
          readOnly: true
        campos_obrigatorios_faltando:
          type: array
          items:
            type: string
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
          title: Cadastrado em
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - atualizado_em
      - campos_obrigatorios_faltando
      - consentimento_registrado
      - criado_em
      - data_nascimento
      - eh_maior_de_idade
      - exame_situacao
      - id
      - idade
      - mensalidade
      - mensalidade_calculada
      - nome
      - turmas_nomes
    AlunoList:
      type: object
      description: |-
        Listagem leve para tabelas.

        Não traz o CPF completo (só mascarado, e só para maior de idade) nem dados do
        responsável: o cadastro completo aparece ao abrir a edição.
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          title: Nome completo
          maxLength: 150
        cpf_mascarado:
          type: string
          readOnly: true
          nullable: true
