openapi: 3.0.3
info:
  title: Sistema ONG do Povo — API
  version: 1.0.0
  description: API do Sistema ONG do Povo (Projeto Integrador). O schema em /api/schema/
    alimenta o gerador de client do frontend.
paths:
  /alunos/:
    get:
      operationId: alunos_list
      description: CRUD de alunos (admin).
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sexo
        schema:
          type: string
          enum:
          - F
          - M
          - N
          - O
        description: |-
          * `M` - Masculino
          * `F` - Feminino
          * `O` - Outro
          * `N` - Prefiro não informar
      - in: query
        name: turmas
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlunoListList'
          description: ''
    post:
      operationId: alunos_create
      description: CRUD de alunos (admin).
      tags:
      - alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
  /alunos/{id}/:
    get:
      operationId: alunos_retrieve
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    put:
      operationId: alunos_update
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    patch:
      operationId: alunos_partial_update
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlunoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlunoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlunoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    delete:
      operationId: alunos_destroy
      description: CRUD de alunos (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Aluno.
        required: true
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /auth/logout/:
    post:
      operationId: auth_logout_create
      description: Apaga o cookie httpOnly do refresh token. O access token em memoria
        continua valido ate expirar, entao o frontend deve limpar o estado da sessao
        imediatamente apos chamar esta rota.
      summary: Encerra a sessao
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Sessao encerrada
  /auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        GET /api/v1/auth/me/

        Dados do usuario autenticado (via header Authorization).
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /auth/token/:
    post:
      operationId: auth_token_create
      description: Recebe usuario e senha, devolve `{access, user}` no corpo e grava
        o refresh token num cookie httpOnly. O campo `refresh` nunca aparece na resposta.
        Limitado a 10 tentativas por minuto por IP.
      summary: Autentica e devolve o access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Credenciais invalidas
        '429':
          description: Limite de tentativas excedido
  /auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Le o refresh token do cookie httpOnly e devolve um novo access
        token. Com ROTATE_REFRESH_TOKENS ligado, o cookie e renovado junto.
      summary: Renova o access token
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Sessao expirada ou sem cookie valido
  /doacoes/:
    post:
      operationId: doacoes_create
      description: Público. Cria o registro sempre como PENDENTE — a equipe confirma
        no extrato. O campo `status` não é aceito no corpo da requisição.
      summary: Registra uma doação
      tags:
      - doacoes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoacaoPublicCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoacaoPublicCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DoacaoPublicCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoacaoCriada'
          description: ''
        '400':
          description: Dados inválidos
        '429':
          description: Limite de envios excedido
  /doacoes/admin/:
    get:
      operationId: doacoes_admin_list
      description: |-
        CRUD da equipe da ONG.

        Fica atrás de `IsAdminUser`. É o mesmo conjunto de dados que o Django admin
        usa — aqui para quando o painel em React entrar na Fase 3.
      parameters:
      - in: query
        name: anonimo
        schema:
          type: boolean
      - in: query
        name: destinacao
        schema:
          type: string
          title: Destinação
          enum:
          - ALIMENTACAO
          - GERAL
          - INFRAESTRUTURA
          - MATERIAL
        description: |-
          * `GERAL` - Onde mais precisar
          * `MATERIAL` - Material esportivo
          * `INFRAESTRUTURA` - Infraestrutura da sede
          * `ALIMENTACAO` - Alimentação e eventos
      - in: query
        name: forma_pagamento
        schema:
          type: string
          title: Forma de pagamento
          enum:
          - CARTAO
          - DINHEIRO
          - PIX
          - TRANSFERENCIA
        description: |-
          * `PIX` - Pix
          * `DINHEIRO` - Dinheiro
          * `CARTAO` - Cartão
          * `TRANSFERENCIA` - Transferência
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELADA
          - CONFIRMADA
          - PENDENTE
        description: |-
          * `PENDENTE` - Pendente
          * `CONFIRMADA` - Confirmada
          * `CANCELADA` - Cancelada
      tags:
      - doacoes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoacaoAdminList'
          description: ''
    post:
      operationId: doacoes_admin_create
      description: |-
        CRUD da equipe da ONG.

        Fica atrás de `IsAdminUser`. É o mesmo conjunto de dados que o Django admin
        usa — aqui para quando o painel em React entrar na Fase 3.
      tags:
      - doacoes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoacaoAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoacaoAdminRequest'
          multipart/form-data:
