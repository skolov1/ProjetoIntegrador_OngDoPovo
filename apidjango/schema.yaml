          $ref: '#/components/schemas/StatusEnum'
        mensagem:
          type: string
      required:
      - email
      - forma_pagamento
      - nome
      - valor
    DoacaoCriada:
      type: object
      description: |-
        Resposta do POST público.

        Declarada como serializer (e não `OpenApiResponse(description=...)`) para que
        o Orval gere o tipo no frontend. Sem isso o client sai como `api<void>` e o
        React perde a verificação de tipo do retorno.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
        mensagem:
          type: string
          readOnly: true
      required:
      - id
      - mensagem
      - status
    DoacaoPublic:
      type: object
      description: |-
        Leitura pública — **zero dado pessoal**.

        Nem doador anônimo, nem identificado: este serializer não tem acesso a
        nome, email ou telefone, então nenhum endpoint que o use pode vazar nada.
        Serve para a seção de impacto e, no futuro, o painel da Fase 3.
      properties:
        id:
          type: integer
          readOnly: true
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        destinacao:
          allOf:
          - $ref: '#/components/schemas/DestinacaoEnum'
          readOnly: true
          title: Destinação
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - destinacao
      - id
      - valor
    DoacaoPublicCreateRequest:
      type: object
      description: |-
        Entrada do formulário público.

        Note que `status`, `confirmado_em` e `criado_em` **nao estao** em `fields`.
        Nao e que sejam `read_only`: eles simplesmente nao existem para o cliente.
        Assim nao existe caminho para o doador se auto-declarar confirmado.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: E-mail
          maxLength: 254
        telefone:
          type: string
          maxLength: 20
        anonimo:
          type: boolean
          title: Doação anônima
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Em reais. Mínimo R$ 1,00.
        forma_pagamento:
          allOf:
          - $ref: '#/components/schemas/FormaPagamentoEnum'
          title: Forma de pagamento
        destinacao:
          allOf:
          - $ref: '#/components/schemas/DestinacaoEnum'
          title: Destinação
        mensagem:
          type: string
      required:
      - email
      - forma_pagamento
      - nome
      - valor
    DoacaoResumo:
