          type: integer
          readOnly: true
        eh_maior_de_idade:
          type: boolean
          readOnly: true
        exame_situacao:
          type: string
          readOnly: true
          nullable: true
        documentos_pendentes:
          type: array
          items:
            type: string
          readOnly: true
        turmas_nomes:
          type: array
          items:
            type: string
          readOnly: true
        mensalidade:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
