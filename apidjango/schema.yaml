      type: object
      description: |-
        CRUD da equipe — único serializer com dado pessoal.

        Protegido por IsAdminUser na view. É o mesmo serializer que gera o client do
        Orval para o painel da Fase 3, então quando ele existir o contrato já está
        definido aqui.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: E-mail
          maxLength: 254
        telefone:
          type: string
          maxLength: 20
        anonimo:
          type: boolean
          title: Doação anônima
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        forma_pagamento:
          allOf:
          - $ref: '#/components/schemas/FormaPagamentoEnum'
          title: Forma de pagamento
        destinacao:
          allOf:
          - $ref: '#/components/schemas/DestinacaoEnum'
          title: Destinação
