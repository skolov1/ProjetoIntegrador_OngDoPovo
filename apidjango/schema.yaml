          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoacaoPublic'
          description: ''
  /doacoes/resumo/:
    get:
      operationId: doacoes_resumo_retrieve
      description: Público. Soma das doações confirmadas, geral e por destinação.
